<div class="container mt-5">
  <h2 class="h4">{{ stable._id ? 'Edit Stable' : 'Add Stable' }}</h2>

  <form (ngSubmit)="onSubmit()" #stableForm="ngForm">
    <div class="form-group mb-3">
      <label for="name">Name</label>
      <input
        id="name"
        type="text"
        class="form-control"
        name="name"
        [(ngModel)]="stable.name"
        required
      />
    </div>

    <div class="form-group mb-3">
      <label for="location">Location</label>
      <input
        id="location"
        type="text"
        class="form-control"
        name="location"
        [(ngModel)]="stable.location"
        required
      />
    </div>

    <button type="submit" class="btn btn-success">
      {{ stable._id ? 'Update' : 'Create' }} Stable
    </button>
  </form>
</div>
