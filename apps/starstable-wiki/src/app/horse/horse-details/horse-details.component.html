<div class="container mt-5" *ngIf="horse">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h2 class="card-title h4">{{ horse.name }}</h2>
      <hr />

      <p class="card-text">
        <strong>ID:</strong> {{ horse._id }}
      </p>

      <p class="card-text">
        <strong>Name:</strong> {{ horse.name }}
      </p>

      <p class="card-text">
        <strong>Breed:</strong> {{ horse.breed }}
      </p>

      <p class="card-text">
        <strong>Age:</strong> {{ horse.age }}
      </p>

      <div class="mt-3">
        <button class="rounded-pink-btn edit me-2" [routerLink]="['/horse-form', horse._id]">
          <i class="bi bi-pencil"></i> Edit
        </button>
        <button class="rounded-pink-btn delete" *ngIf="horse._id" (click)="onDelete()">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>
