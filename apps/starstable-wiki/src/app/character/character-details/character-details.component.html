<div class="container mt-5" *ngIf="character">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h2 class="card-title h4">{{ character.name }}</h2>
      <hr />

      <p class="card-text">
        <strong>ID:</strong> {{ character._id }}
      </p>

      <p class="card-text">
        <strong>Riding Skill:</strong> {{ character.ridingSkill }}
      </p>

      <p class="card-text">
        <strong>User:</strong> {{ getDisplayName(character.userId) }}
      </p>
      
      <p class="card-text">
        <strong>Stable:</strong> {{ getDisplayName(character.stableId) }}
      </p>      

      <div class="mt-3">
        <button class="rounded-pink-btn edit me-2" [routerLink]="['/character-form', character._id]">
          <i class="bi bi-pencil"></i> Edit
        </button>
        <button class="rounded-pink-btn delete" (click)="onDelete(character._id)">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>
