<div class="container mt-5">
  <h1>{{ character._id ? 'Edit' : 'Create' }} Character</h1>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" class="form-control" id="name" [(ngModel)]="character.name" name="name" required />
    </div>

    <div class="form-group">
      <label for="ridingSkill">Riding Skill</label>
      <input type="number" class="form-control" id="ridingSkill" [(ngModel)]="character.ridingSkill" name="ridingSkill" required />
    </div>

    <input type="hidden" [(ngModel)]="character.userId" name="userId" />

    <div class="form-group" *ngIf="character._id">
      <label for="stableId">Stable</label>
      <select id="stableId" [(ngModel)]="character.stableId" name="stableId" required class="form-control">
        <option *ngFor="let stable of stables" [value]="stable._id">
          {{ stable.name }} - {{ stable.location }}
        </option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">
      {{ character._id ? 'Update' : 'Create' }} Character
    </button>
  </form>
</div>
